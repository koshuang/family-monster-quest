version: 2.1

parameters:
  run_ci:
    type: boolean
    default: false

jobs:
  validate:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Run provider-neutral CI contract
          command: bash .ci/run.sh

workflows:
  fallback-ci:
    when: << pipeline.parameters.run_ci >>
    jobs:
      - validate
